server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Looking the backend up per request (instead of
    # once at startup) means nginx still starts if the backend isn't up yet,
    # and follows the backend if its container restarts with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The browser only ever talks to this origin; nginx forwards API calls.
    location /api/ {
        set $backend http://backend:8000;
        # With a variable and no URI part, nginx passes the original
        # request path (/api/...) through unchanged.
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
