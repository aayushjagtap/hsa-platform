server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # The browser only ever talks to this origin; nginx forwards API calls.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
